<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join our Discord</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--card2:#f2f3f5;--text:#060607;--sub:#5c5e66;--line:#e3e5e8;--blur:#5865f2;--green:#248046;--green-h:#1a6334;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1e1f22;--card:#2b2d31;--card2:#232428;--text:#f2f3f5;--sub:#b5bac1;--line:#3f4147}}
:root[data-theme="dark"]{--bg:#1e1f22;--card:#2b2d31;--card2:#232428;--text:#f2f3f5;--sub:#b5bac1;--line:#3f4147}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"gg sans","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
.o1{width:380px;height:380px;background:#5865f2;top:-120px;left:-100px;animation:drift 14s ease-in-out infinite}
.o2{width:320px;height:320px;background:#eb459e;bottom:-110px;right:-90px;opacity:.35;animation:drift 18s ease-in-out infinite reverse}
.o3{width:260px;height:260px;background:#57f287;top:45%;left:60%;opacity:.18;animation:drift 22s ease-in-out infinite}
nav{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 20px;font-weight:800;letter-spacing:.2px}
nav img{width:30px;height:30px;border-radius:50%}
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:16px 18px;perspective:900px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .8s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s ease-out}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.8px;color:var(--sub);text-transform:uppercase;margin-bottom:16px}
.row{display:flex;align-items:center;gap:14px;background:var(--card2);border-radius:12px;padding:14px}
.icon{position:relative;flex:none}
.icon img{width:64px;height:64px;border-radius:18px;display:block;animation:float 4s ease-in-out infinite}
.dot{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#23a55a;border:3px solid var(--card2)}
.dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #23a55a;animation:ping 2s ease-out infinite}
.name{font-weight:800;font-size:1.15rem;margin-bottom:4px}
.meta{font-size:.82rem;color:var(--sub);display:flex;align-items:center;gap:6px}
.meta i{width:8px;height:8px;border-radius:50%;background:#23a55a;display:inline-block}
.btn{display:block;text-align:center;margin-top:18px;background:var(--green);color:#fff;font-weight:700;font-size:1rem;text-decoration:none;padding:13px 16px;border-radius:8px;position:relative;overflow:hidden;transition:background .15s,transform .15s}
.btn:hover{background:var(--green-h)}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
.link{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--sub);background:var(--card2);border-radius:8px;padding:9px 12px}
.link b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link button{background:none;border:0;color:var(--blur);font-weight:700;cursor:pointer;font-size:.82rem;font-family:inherit}
footer{position:relative;z-index:2;text-align:center;font-size:.75rem;color:var(--sub);padding:10px 16px 16px}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.sec{margin:18px 0 8px;font-size:.72rem;font-weight:800;letter-spacing:.8px;color:var(--sub);text-transform:uppercase}
.mem{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;animation:rise .6s both;transition:background .15s}
.mem:hover{background:var(--card2)}
.mem:nth-of-type(1){animation-delay:.5s}.mem:nth-of-type(2){animation-delay:.65s}.mem:nth-of-type(3){animation-delay:.8s}.mem:nth-of-type(4){animation-delay:.95s}
.av{position:relative;flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.95rem}
.av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;background:var(--s);border:3px solid var(--card)}
.mn{font-weight:700;font-size:.95rem}
.mr{font-size:.76rem;color:var(--sub)}
.tag{margin-left:auto;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub)}
</style>
</head>
