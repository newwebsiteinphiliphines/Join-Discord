<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join our Discord</title>
<style>
:root{--bg:#5865f2;--card:rgba(255,255,255,.12);--text:#fff;--sub:rgba(255,255,255,.85);--btn:#fff;--btntext:#4752c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#3b45b5;--card:rgba(0,0,0,.22)}}
:root[data-theme="dark"]{--bg:#3b45b5;--card:rgba(0,0,0,.22)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.card{background:var(--card);border-radius:24px;padding:32px 24px;max-width:380px;width:100%;text-align:center}
.logo{width:110px;height:110px;border-radius:50%;object-fit:cover;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
h1{font-size:1.6rem;margin:0 0 8px}
p{color:var(--sub);margin:0 0 20px;line-height:1.5}
.btn{display:block;background:var(--btn);color:var(--btntext);font-weight:700;text-decoration:none;padding:14px 18px;border-radius:999px;margin-bottom:12px;font-size:1rem}
.btn.alt{background:transparent;color:var(--text);border:2px solid rgba(255,255,255,.6)}
#status{font-size:.9rem;min-height:1.2em;color:var(--sub)}
body{position:relative;overflow:hidden;background:linear-gradient(135deg,#5865f2,#7983f5,#4752c4,#5865f2);background-size:300% 300%;animation:bg 10s ease infinite}
.card{position:relative;z-index:1;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.logo{animation:float 3s ease-in-out infinite,glow 3s ease-in-out infinite}
h1{animation:rise .8s .2s both}
p{animation:rise .8s .35s both}
.btn{animation:rise .8s .5s both,pulse 2s 1.5s ease-in-out infinite;transition:transform .15s}
.btn:active{transform:scale(.96)}
.bubbles span{position:absolute;bottom:-60px;border-radius:50%;background:rgba(255,255,255,.18);animation:up linear infinite}
.bubbles span:nth-child(1){left:8%;width:30px;height:30px;animation-duration:9s}
.bubbles span:nth-child(2){left:25%;width:18px;height:18px;animation-duration:7s;animation-delay:2s}
.bubbles span:nth-child(3){left:45%;width:40px;height:40px;animation-duration:11s;animation-delay:1s}
.bubbles span:nth-child(4){left:65%;width:22px;height:22px;animation-duration:8s;animation-delay:3s}
.bubbles span:nth-child(5){left:80%;width:34px;height:34px;animation-duration:10s}
.bubbles span:nth-child(6){left:92%;width:16px;height:16px;animation-duration:6s;animation-delay:4s}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.25)}50%{box-shadow:0 10px 36px rgba(255,255,255,.45)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes up{from{transform:translateY(0);opacity:.9}to{transform:translateY(-110vh);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
